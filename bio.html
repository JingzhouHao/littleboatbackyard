<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <meta
    name="description"
    content="Bio and CV — Little Boat's Backyard."
  />

  <meta
    name="theme-color"
    content="#f3efe5"
  />

  <title>
    Bio — Little Boat's Backyard
  </title>

  <link
    rel="stylesheet"
    href="assets/css/styles.css"
  />

</head>


<body class="inner-page bio-page">


  <!-- =====================================================
       TOP NAVIGATION
       ===================================================== -->

  <header class="topbar">

    <a
      class="brand"
      href="index.html"
      id="bio-brand"
    >
      Little Boat's Backyard
    </a>


    <nav
      class="topnav"
      aria-label="Site navigation"
    >

      <a href="photography.html">
        Photography
      </a>

      <a
        class="is-current"
        href="bio.html"
      >
        Bio
      </a>

    </nav>

  </header>



  <main>


    <!-- ===================================================
         HERO
         =================================================== -->

    <section class="page-hero bio-hero">

      <img
        id="bio-cover"
        src="assets/images/cover.jpeg"
        alt="Bio cover"
      />


      <div
        class="page-hero-shade"
        aria-hidden="true"
      ></div>


      <div class="page-hero-title">

        <h1>Bio</h1>

      </div>

    </section>



    <!-- ===================================================
         BIO

         No repeated "About / 关于我" label here.
         =================================================== -->

    <section class="bio-intro-section">

      <figure class="bio-portrait-wrap">

        <img
          id="bio-portrait"
          src="assets/images/cover.jpeg"
          alt="Portrait"
        />

      </figure>


      <div class="bio-copy">

        <h2 id="bio-name">
          Jingzhou Hao
        </h2>


        <div
          id="bio-text"
          class="bio-text"
        ></div>

      </div>

    </section>



    <!-- ===================================================
         CV
         =================================================== -->

    <section
      class="cv-section"
      id="cv-section"
    >

      <div>

        <p class="kicker">
          Curriculum Vitae
        </p>

        <h2>
          CV
        </h2>

      </div>


      <div class="cv-copy">

        <p id="cv-description">
          A PDF copy of my CV is available here.
        </p>


        <a
          class="cv-button"
          id="cv-link"
          href="#"
          download
        >
          Download CV
          <span aria-hidden="true">↓</span>
        </a>


        <p
          class="cv-missing"
          id="cv-missing"
        >
          Add your PDF path in
          <code>site-data.js</code>
          to enable this button.
        </p>

      </div>

    </section>


  </main>



  <!-- =====================================================
       FOOTER
       ===================================================== -->

  <footer class="site-footer site-footer--paper">

    <div
      class="social-links"
      id="bio-social-links"
      aria-label="Social links"
    ></div>


    <p
      class="copyright"
      id="bio-copyright"
    ></p>

  </footer>



  <script src="assets/js/site-data.js"></script>

  <script src="assets/js/shared.js"></script>

  <script src="assets/js/bio.js"></script>


</body>

</html>
