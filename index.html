<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="个人摄影作品集" />

    <div class="hero-copy">
      <p class="eyebrow" id="site-title">小船的后院</p>

    <span>© <span id="year"></span></span>
